const legsEl = document.getElementById('legs');

let toastT;

function toast(text, icon='✓'){
  document.getElementById('toastText').textContent = text;
  document.getElementById('toastIcon').textContent = icon;
  const t = document.getElementById('toast');
  t.classList.remove('hide'); clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.add('hide'), 2100);
}

/* ================= цены ================= */
const pCache = new Map();
function priceFor(y,m,d){
  const k = y+'-'+m+'-'+d;
  if (pCache.has(k)) return pCache.get(k);
  let h = 0; for (let i=0;i<k.length;i++) h = (h*31 + k.charCodeAt(i)) % 99991;
  const p = 5200 + (h % 13800) + (d % 3) * 610;
  pCache.set(k, p); return p;
}
function estimate(fromFull, toFull){
  let h = 0; const s = (fromFull||'') + (toFull||'') || 'x';
  for (let i=0;i<s.length;i++) h = (h*33 + s.charCodeAt(i)) % 99991;
  return 9400 + (h % 24000);
}
const val = (r,f) => r.querySelector(`[data-field="${f}"]`).dataset.full;
const filled = r => val(r,'from') && val(r,'to');

/* общая сумма «от 00 000 ₽» */
function recalcTotal(){
  const rows = [...legsEl.children];
  let sum = 0, done = 0;
  rows.forEach(r => {
    if (!filled(r)) return;
    done++;
    sum += r.dataset.price ? +r.dataset.price : estimate(val(r,'from'), val(r,'to'));
  });
  const el = document.getElementById('total');
  const next = done ? 'от ' + money(sum) : 'от 0 ₽';
  if (el.textContent !== next){ el.textContent = next; el.classList.remove('money-bump'); void el.offsetWidth; el.classList.add('money-bump'); }
  document.getElementById('totalNote').textContent = done
    ? `${done} ${done===1?'сегмент':done<5?'сегмента':'сегментов'} · за 1 пассажира · багаж включён`
    : 'Заполните маршрут, чтобы увидеть цену';
}

        <span class="date-icon flex items-center">${CAL_ICON}</span>
        <span class="date-label hidden text-[11.5px] leading-none text-slate-200 whitespace-nowrap"></span>
        <span class="date-price text-[9.5px] leading-none text-slate-600"></span>
      </button>
    </div>

    <!-- иконки снизу блока справа: ➕ добавить · 🔄 поменять · 🗑 удалить -->
    <div class="row-actions flex items-center justify-end gap-1 pr-0.5">
      <button type="button" class="plus-btn h-7 pl-1.5 pr-2 rounded-lg hover:bg-emerald-500/15 active:bg-emerald-500/25 text-emerald-400 flex items-center gap-1.5 text-[10.5px] font-semibold transition" title="Добавить направление под этой строкой">${ICO_PLUS}<span>добавить направление</span></button>
      <span class="plus-divider mx-0.5 w-px h-4 bg-[#28324a]"></span>
      <button type="button" class="swap-btn w-7 h-7 rounded-lg hover:bg-blue-500/15 active:bg-blue-500/25 text-blue-400 flex items-center justify-center transition" title="Поменять местами">${ICO_SWAP}</button>
      <button type="button" class="del-btn w-7 h-7 rounded-lg hover:bg-red-500/15 active:bg-red-500/25 text-red-400 flex items-center justify-center transition" title="Удалить строку">${ICO_DEL}</button>
    </div>

    <!-- выпадающий список -->
    <div class="suggest-panel hidden absolute left-2.5 right-2.5 top-[62px] z-40 bg-[#151c29] border border-[#2a3346] rounded-2xl shadow-2xl overflow-hidden fade-in">
      <div class="flex items-center gap-2 px-3 h-11 border-b border-[#232c40]">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#64748b" stroke-width="1.8"/><path d="M16.5 16.5L21 21" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" class="suggest-input w-full bg-transparent outline-none text-[12.5px] text-slate-100 placeholder-slate-500" placeholder="Город, страна, аэропорт или код">
      </div>
      <div class="suggest py-1"></div>
    </div>`;

  row.addEventListener('pointerdown', () => {
    document.querySelectorAll('.leg-row.touched').forEach(r => r !== row && r.classList.remove('touched'));
    row.classList.add('touched');
  });

  /* кликабельные слова */
  row.querySelectorAll('.word').forEach(w => w.addEventListener('click', e => { e.stopPropagation(); openSuggest(row, w.dataset.field); }));

  /* 🗑 удалить */
  row.querySelector('.del-btn').addEventListener('click', () => {
    closePanels();
    if (legsEl.children.length > 1){
      row.classList.add('leaving');
      setTimeout(()=>{ row.remove(); refresh(); toast('Направление удалено', '🗑'); }, 220);
    } else {
      row.querySelectorAll('.word').forEach(w => setWord(w, ''));
      resetDateBtn(row);
      refresh(); toast('Поля очищены', '↺');
    }
  });

  /* 🔄 поменять местами */
  row.querySelector('.swap-btn').addEventListener('click', e => {
    const btn = e.currentTarget;
    btn.classList.remove('swap-anim'); void btn.offsetWidth; btn.classList.add('swap-anim');
    const rows = [...legsEl.children];
    if (rows.length === 1){
      swapRoute(row, row); pulse(row); recalcTotal();
      toast('Точки маршрута поменялись местами', '🔄');
    } else {
      const i = rows.indexOf(row), other = rows[i+1] || rows[i-1];
      swapRoute(row, other); pulse(row); pulse(other); recalcTotal();
      toast('Сегменты поменялись — даты на месте', '🔄');
    }
  });

  /* ➕ добавить направление ПОД этой строкой */
  row.querySelector('.plus-btn').addEventListener('click', e => {
    const ic = e.currentTarget.querySelector('svg');
    ic.classList.remove('plus-anim'); void ic.offsetWidth; ic.classList.add('plus-anim');
    insertBelow(row);
  });

  /* 📅 календарь */
  row.querySelector('.date-btn').addEventListener('click', e => { e.stopPropagation(); closePanels(); openCalendar(row); });

  legsEl.appendChild(row);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ row.classList.remove('entering'); refresh(); }));
  return row;
}

function setWord(w, full){
  w.dataset.full = full || '';
  if (!full){ w.textContent = w.dataset.field === 'from' ? 'Откуда' : 'Куда'; w.classList.add('empty'); return; }
  const p = PLACES.find(x => `${x.city}, ${x.country} · ${x.code}` === full);
  w.classList.remove('empty');
  w.textContent = p ? `${p.city} ${p.code}` : full;
}
function swapRoute(a, b){
  const af=a.querySelector('[data-field="from"]'), at=a.querySelector('[data-field="to"]');
  const bf=b.querySelector('[data-field="from"]'), bt=b.querySelector('[data-field="to"]');
  const f=af.dataset.full, t=at.dataset.full;
  setWord(af, bf.dataset.full); setWord(at, bt.dataset.full);
  setWord(bf, f); setWord(bt, t);
}
function pulse(r){ r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash'); }

/* --- доступность добавления: появляется после заполнения первой строки --- */
function chainReady(){ return [...legsEl.children].some(filled); }

function refresh(){
  const rows = [...legsEl.children];
  const ready = chainReady();
  const left = MAX_LEGS - rows.length;

  addBtn.disabled = !ready || left <= 0;
  addBtn.classList.toggle('opacity-40', !ready || left <= 0);
  addLabel.textContent = !ready ? 'Сначала заполните первое направление'
    : left > 0 ? `Добавить направление · осталось ${left}` : 'Максимум 5 направлений';

  /* плюс на всех строках, кроме последней; только когда цепочка заполнена */
  rows.forEach((r, i) => {
    const show = ready && i !== rows.length - 1;
    r.querySelector('.plus-btn').classList.toggle('hidden', !show);
    r.querySelector('.plus-divider').classList.toggle('hidden', !show);
  });
  recalcTotal();
}

/* вставка новой строки под указанной: from = её «Куда», to = «Откуда» нижнего блока */
function insertBelow(anchor){
  if (legsEl.children.length >= MAX_LEGS) return toast('Максимум 5 направлений', 'ℹ');
  const from = val(anchor, 'to');
  const below = anchor.nextElementSibling;
  const to = below ? val(below, 'from') : '';

  const row = createLeg();
  legsEl.insertBefore(row, anchor.nextElementSibling === row ? row : anchor.nextElementSibling);
  setWord(row.querySelector('[data-field="from"]'), from);
  if (to) setWord(row.querySelector('[data-field="to"]'), to);
  refresh();
  toast('Направление добавлено под строкой', '➕');
  setTimeout(()=>openSuggest(row, to ? 'from' : 'to'), 60);
  return row;
}

/* нижняя кнопка: добавляем в конец, «Откуда» из прошлого сегмента */
addBtn.addEventListener('click', () => {
  if (legsEl.children.length >= MAX_LEGS) return toast('Максимум 5 направлений', 'ℹ');
  if (!chainReady()) return toast('Сначала заполните первое направление', '⚠');
  const last = legsEl.lastElementChild;
  const from = val(last, 'to');
  const row = createLeg();
  if (from) setWord(row.querySelector('[data-field="from"]'), from);
  refresh();
  toast(from ? '«Откуда» взято из прошлого сегмента' : 'Строка добавлена', '✨');
  setTimeout(()=>openSuggest(row, from ? 'to' : 'from'), 60);
});

/* ================= выпадающий список ================= */
function closePanels(){ document.querySelectorAll('.suggest-panel').forEach(p => p.classList.add('hidden')); }
function openSuggest(row, field){
  closePanels();
  const panel = row.querySelector('.suggest-panel');
  const input = panel.querySelector('.suggest-input');
  panel.dataset.field = field;
  input.value = '';
  input.placeholder = field === 'from' ? 'Откуда: город, страна, аэропорт' : 'Куда: город, страна, аэропорт';
  renderList(panel.querySelector('.suggest'), '', field);
  panel.classList.remove('hidden');
  setTimeout(()=>input.focus(), 40);
}
function renderList(list, q){
  const s = q.trim().toLowerCase();
  const items = PLACES.filter(p => !s ||
    p.city.toLowerCase().includes(s) || p.country.toLowerCase().includes(s) ||
    p.code.toLowerCase().includes(s) || p.airport.toLowerCase().includes(s)).slice(0,8);
  if (!items.length){ list.innerHTML = '<div class="px-3 py-4 text-center text-[11.5px] text-slate-500">Ничего не найдено</div>'; return; }
  list.innerHTML = items.map(p => `
    <button type="button" class="opt w-full flex items-center gap-2.5 px-3 py-2.5 hover:bg-[#212b40] active:bg-[#212b40] text-left transition"
      data-full="${p.city}, ${p.country} · ${p.code}">
      <span class="w-7 h-7 rounded-lg bg-[#1e2739] flex items-center justify-center shrink-0">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M2 16l20-6-3-2-6 2-7-6-2 1 5 6-5 2-2-1-1 1 3 3z" fill="#60a5fa"/></svg>
      </span>
      <span class="min-w-0 flex-1">
        <span class="block text-[12.5px] text-slate-100 truncate">${p.city} <span class="text-slate-500">· ${p.country}</span></span>
        <span class="block text-[10px] text-slate-500 truncate">${p.airport}</span>
      </span>
      <span class="shrink-0 text-[10px] font-bold text-blue-400 bg-blue-500/10 rounded-md px-1.5 py-1">${p.code}</span>
    </button>`).join('');
  list.querySelectorAll('.opt').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    const row = b.closest('.leg-row');
    setWord(row.querySelector(`[data-field="${b.closest('.suggest-panel').dataset.field}"]`), b.dataset.full);
    closePanels(); refresh();
  }));
}
document.addEventListener('input', e => {
  if (!e.target.classList.contains('suggest-input')) return;
  const panel = e.target.closest('.suggest-panel');
  renderList(panel.querySelector('.suggest'), e.target.value);
});

/* ================= кнопка даты ================= */
function applyDate(row, date, price, isCheapest){
  row.dataset.date = date.toISOString();
  row.dataset.price = price;
  const btn = row.querySelector('.date-btn');
  btn.classList.remove('text-slate-500');
  btn.querySelector('.date-icon').classList.add('hidden');          // иконка исчезает
  const lbl = btn.querySelector('.date-label');
  lbl.classList.remove('hidden');
  lbl.textContent = `${String(date.getDate()).padStart(2,'0')} ${MONTHS_S[date.getMonth()]}. ${DOW_S[date.getDay()]}`;
  const pr = btn.querySelector('.date-price');                      // цена остаётся
  pr.textContent = money(price);
  pr.classList.remove('text-slate-600','text-emerald-400','text-slate-300');
  pr.classList.add(isCheapest ? 'text-emerald-400' : 'text-slate-300');
  refresh();
}
function resetDateBtn(row){
  delete row.dataset.date; delete row.dataset.price;
  const btn = row.querySelector('.date-btn');
  btn.classList.add('text-slate-500');
  btn.querySelector('.date-icon').classList.remove('hidden');
  btn.querySelector('.date-label').classList.add('hidden');
  const pr = btn.querySelector('.date-price');
  pr.textContent = ''; pr.classList.remove('text-emerald-400','text-slate-300'); pr.classList.add('text-slate-600');
  refresh();
}

/* ================= календарь ================= */
const cal = document.createElement('div');
cal.className = 'hidden absolute z-[70] left-3 right-3 top-[190px] bg-[#151c29] border border-[#2a3346] rounded-3xl shadow-2xl p-3.5 fade-in';
cal.innerHTML = `
  <div class="flex items-center justify-between mb-2.5">
    <button id="calPrev" class="w-8 h-8 rounded-lg hover:bg-[#232b3d] flex items-center justify-center text-slate-300">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div id="calTitle" class="text-[13px] font-semibold text-slate-100 capitalize"></div>
    <button id="calNext" class="w-8 h-8 rounded-lg hover:bg-[#232b3d] flex items-center justify-center text-slate-300">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="grid grid-cols-7 gap-1 mb-1 text-center text-[9.5px] text-slate-500 font-medium">
    <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div>
    <div class="text-blue-400">Сб</div><div class="text-blue-400">Вс</div>
  </div>
  <div id="calGrid" class="grid grid-cols-7 gap-1"></div>
  <div class="flex items-center justify-center gap-3.5 mt-2.5 text-[9.5px] text-slate-500 flex-wrap">
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-400"></span>выходные</span>
    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-blue-600"></span>даты маршрута</span>
    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-[#1e4d8f]"></span>между датами</span>
    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400"></span>лучшая цена</span>
  </div>`;
document.getElementById('phone').appendChild(cal);

let calRow = null, calView = new Date();

/* все даты маршрута + диапазон между ними */
function routeMarks(){
  const ts = [...legsEl.children].filter(r => r.dataset.date).map(r => new Date(r.dataset.date).getTime());
  const inRoute = new Set(ts);
  let between = new Set();
  if (ts.length > 1){
    const mn = Math.min(...ts), mx = Math.max(...ts);
    for (let t = mn; t <= mx; t += 86400000) if (!inRoute.has(t)) between.add(t);
  }
  return { inRoute, between };
}

function openCalendar(row){
  calRow = row;
  const base = row.dataset.date ? new Date(row.dataset.date) : today;
  calView = new Date(base.getFullYear(), base.getMonth(), 1);
  drawCal(); cal.classList.remove('hidden');
}
function drawCal(){
  const y = calView.getFullYear(), m = calView.getMonth();
  document.getElementById('calTitle').textContent = MONTHS[m] + ' ' + y;
  const off = (new Date(y,m,1).getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
  const { inRoute, between } = routeMarks();
  let min = Infinity, minD = 0;
  for (let d=1; d<=dim; d++){ const dt = new Date(y,m,d); if (dt >= today){ const p = priceFor(y,m,d); if (p < min){ min = p; minD = d; } } }

  let html = '';
  for (let i=0;i<off;i++) html += '<div></div>';
  for (let d=1; d<=dim; d++){
    const dt = new Date(y,m,d), t = dt.getTime(), wd = dt.getDay(), past = dt < today;
    const cheap = !past && d === minD;
    const inR = inRoute.has(t), btw = between.has(t);
    const cls = ['cal-day', (wd===0||wd===6)?'weekend':'', past?'disabled':'',
      inR?'selected inroute':(btw?'between':''),
      dt.getTime()===today.getTime()&&!inR&&!btw?'today':'', cheap?'cheap':''].join(' ');
    html += `<div class="${cls}" data-day="${d}" data-cheap="${cheap?1:0}" ${past?'':'data-active="1"'}>
      <span class="d">${d}</span><span class="p">${past?'—':money(priceFor(y,m,d))}</span></div>`;
  }
  const g = document.getElementById('calGrid');
  g.innerHTML = html;
  g.querySelectorAll('[data-active]').forEach(c => c.addEventListener('click', () => {
    applyDate(calRow, new Date(y,m,+c.dataset.day), priceFor(y,m,+c.dataset.day), c.dataset.cheap === '1');
    closeCal();
  }));
}
document.getElementById('calPrev').onclick = e => { e.stopPropagation(); calView.setMonth(calView.getMonth()-1); drawCal(); };
document.getElementById('calNext').onclick = e => { e.stopPropagation(); calView.setMonth(calView.getMonth()+1); drawCal(); };
function closeCal(){ cal.classList.add('hidden'); calRow = null; }
document.addEventListener('pointerdown', e => {
  if (!cal.classList.contains('hidden') && !cal.contains(e.target) && !e.target.closest('.date-btn')) closeCal();
  if (!e.target.closest('.leg-row')){
    closePanels();
    document.querySelectorAll('.leg-row.touched').forEach(r => r.classList.remove('touched'));
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeCal(); closePanels(); } });

/* ================= навигация ================= */
const scrSearch = document.getElementById('scrSearch'), scrThanks = document.getElementById('scrThanks');
document.querySelector('[data-back]').addEventListener('click', () => {
  scrThanks.classList.add('off-r'); scrSearch.classList.remove('off-r');
  closeCal(); closePanels();
});

/* ================= поиск → экран «спасибо» ================= */
document.getElementById('searchBtn').addEventListener('click', () => {
  const any = [...legsEl.children].some(filled);
  if (!any) return toast('Выберите «Откуда» и «Куда»', '⚠');
  scrSearch.classList.add('off-r'); scrThanks.classList.remove('off-r');
  scrThanks.scrollTop = 0;
});

/* ================= старт: все поля пустые ================= */
createLeg();
refresh();
</script>
</body>
